name: PI Owner History Daily

on:
  push:
    branches: [main]
    paths:
      - 'pi/update-owner-history.mjs'
      - '.github/workflows/pi-owner-history-daily.yml'
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'UTC date to rebuild (YYYY-MM-DD); blank = yesterday'
        required: false
        type: string

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: pi-owner-history-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collect verified owner history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: node pi/update-owner-history.mjs
      - name: Validate owner dashboard contracts
        run: |
          node pi/owner-dashboard-test.mjs
          node pi/owner-workspace-ui-test.mjs
          node worker/src/owner-workspace-test.mjs
      - name: Commit verified daily snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pi/engineering-history.json worker/src/owner-history.mjs; then
            echo "No owner history changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "PI History Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pi/engineering-history.json worker/src/owner-history.mjs
          git commit -m "Update verified PI owner history"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy PI Worker with fresh owner history
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pi-chat-worker.yml --ref main
